<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#05080d">
<meta name="description" content="Dickson's personal AI operating system.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2.6"/><circle cx="4.5" cy="6" r="1.7"/><circle cx="19.5" cy="6" r="1.7"/><circle cx="5" cy="18.5" r="1.7"/><circle cx="19" cy="18.5" r="1.7"/><path d="M6 7l4 3.4M18 7l-4 3.4M6.4 17.4l3.6-3.6M17.6 17.4L14 13.8"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M2.5 19c.7-3.2 3-5 5.5-5s4.8 1.8 5.5 5"/><circle cx="17" cy="9" r="3.4"/><circle cx="17" cy="9" r="1" fill="currentColor"/></symbol>
  <symbol id="i-desk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M9 9v9"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></symbol>
  <symbol id="i-appr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h16"/><rect x="5" y="13" width="3" height="7"/><rect x="10.5" y="9" width="3" height="11"/><rect x="16" y="4" width="3" height="16"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="i-idea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h4l2-4 3 8 2-4h7"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 18z"/></symbol>
  <symbol id="i-hex" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 2l12 7v14l-12 7-12-7V9z"/><path d="M16 9l6 3.5v7L16 23l-6-3.5v-7z"/><path d="M16 2v7M28 9l-6 3.5M28 23l-6-3.5M16 30v-7M4 23l6-3.5M4 9l6 3.5"/></symbol>
</svg>

<!-- ================= BRAIN (home) ================= -->
<section id="brain" aria-label="Jarvis Brain">
  <canvas id="gcv" aria-label="Knowledge graph. Drag to rotate, tap a node to focus."></canvas>
  <button class="db mobtog l" id="tgL" aria-label="Show brain panel"><svg><use href="#i-menu"/></svg></button>
  <button class="db mobtog r" id="tgR" aria-label="Show Jarvis panel"><svg><use href="#i-pulse"/></svg></button>

  <div class="bp bp-left" id="bpL">
    <div class="bhead"><svg class="hex"><use href="#i-hex"/></svg><div><b>JARVIS BRAIN</b><small id="gcount">—</small></div></div>
    <div class="navmini" id="navmini"></div>
    <div class="sec"><div class="field"><svg width="15" height="15" class="dim"><use href="#i-search"/></svg><input id="gq" placeholder="Search the brain…" aria-label="Search the brain"><span class="mono dim kbd">/</span></div><div class="sres" id="gres"></div></div>
    <div class="sec"><h3>Inspector</h3><div class="insp" id="insp"></div></div>
    <div class="sec"><h3>Top hubs</h3><div class="hubs" id="hubs"></div></div>
    <div class="sec"><h3>Display</h3><div id="disp"></div></div>
  </div>

  <div class="btool" role="toolbar" aria-label="Graph view">
    <button id="tbFit"><svg width="15" height="15"><use href="#i-fit"/></svg><span>Fit</span></button>
    <button id="tb3d" aria-pressed="true"><span>3D</span></button>
    <button id="tbSync" class="syncchip" aria-label="Drive sync status"><svg width="15" height="15"><use href="#i-cloud"/></svg><span id="syncLbl">Offline</span></button>
  </div>

  <div class="bp bp-right" id="bpR">
    <div class="box"><div class="rowsb"><span class="label">Filter</span><button id="filtAll" class="label linkish">All</button></div><div class="filt" id="filt"></div></div>
    <div class="box">
      <div class="orbwrap"><canvas id="orb" width="340" height="340"></canvas><div class="core">J.A.R.V.I.S</div></div>
      <div class="orbrow"><button class="chip listen" id="ptt" aria-label="Hold to talk">◉ HOLD TO TALK</button></div>
      <div class="orbrow"><button class="chip" id="wakeBtn" aria-pressed="false">HEY JARVIS · OFF</button><button class="chip" id="spkBtn" aria-pressed="true">VOICE ON</button></div>
      <div class="orbstate" id="orbState">Ready</div>
      <div class="heard" id="heard"></div>
    </div>
  </div>

  <div class="breply" id="breply"></div>
  <div class="bdock">
    <form class="cmdf" data-cmd autocomplete="off"><button type="button" class="mic" data-mic aria-label="Hold to talk"><svg><use href="#i-mic"/></svg></button><canvas class="wv mini" aria-hidden="true"></canvas><input placeholder="Ask Jarvis… “morning brief”, “idea: …”, “queue: …”" aria-label="Ask Jarvis"><button class="send" aria-label="Send"><svg width="17" height="17"><use href="#i-send"/></svg></button></form>
    <button class="db" id="ideaBtn" aria-label="New idea" style="color:var(--amber)"><svg><use href="#i-idea"/></svg></button>
  </div>
</section>

<!-- ================= WORKSPACE ================= -->
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand"><svg class="hex"><use href="#i-hex"/></svg><div><b>JARVIS</b><small id="verLbl">v1</small></div></div>
    <nav class="views" id="nav"></nav>
    <div class="railfoot">
      <button class="syncchip wide" id="railSync"><svg width="15" height="15"><use href="#i-cloud"/></svg><span id="railSyncLbl">Offline</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="wcmd" id="wcmd" hidden><div><div id="wreply"></div><form class="cmdf" data-cmd autocomplete="off"><button type="button" class="mic" data-mic aria-label="Hold to talk"><svg><use href="#i-mic"/></svg></button><canvas class="wv mini" aria-hidden="true"></canvas><input placeholder="Ask Jarvis…" aria-label="Ask Jarvis"><button class="send" aria-label="Send"><svg width="17" height="17"><use href="#i-send"/></svg></button></form></div></div>
<nav class="mnav" id="mnav" aria-label="Views" hidden></nav>

<script src="js/config.js"></script>
<script src="js/drive.js"></script>
<script src="js/voice.js"></script>
<script src="js/sample.js"></script>
<script src="js/brain.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
